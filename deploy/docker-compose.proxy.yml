# Bundled Caddy with automatic HTTPS, loaded by deploy/common.sh when AUTO_HTTPS=true is in the .env.
# Paths are relative to the repo root, because docker-compose.yml is the first file.

services:
  caddy:
    image: caddy:2-alpine
    container_name: askf-caddy
    oom_score_adj: -500
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN missing}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - askf-caddy-data:/data
      - askf-caddy-config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

volumes:
  askf-caddy-data:
  askf-caddy-config:
