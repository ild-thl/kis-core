name: Deploy Hetzner

# Deploys main to the Hetzner box, only when started by hand from the Actions tab, never on push or merge.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if jobs are still running
        type: boolean
        default: false

# Two deploys never run at the same time, a second one waits.
concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    # Only the owner's repository runs this, copies of the code skip it without an error.
    if: github.repository == 'hamidmergan/kis-core' && github.ref == 'refs/heads/main' && github.actor == 'hamidmergan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run the deploy script on Hetzner
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
          HOST: ${{ vars.HETZNER_HOST }}
          MODE: ${{ inputs.force && 'force' || 'normal' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key may only start the deploy script on the box, the word after the host is its argument.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "root@$HOST" "$MODE"
